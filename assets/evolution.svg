<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1120" role="img" aria-labelledby="evolution-title evolution-desc">
  <title id="evolution-title">Kairosys five-stage engineering lineage</title>
  <desc id="evolution-desc">A compact vertical lineage runs from a persistent assistant in April 2025 to trust-first financial research after a domain pivot and 2026 greenfield rewrite.</desc>
  <rect width="390" height="1120" fill="#EEF1F3"/><rect x="12" y="12" width="366" height="1096" rx="10" fill="#FAFBFC" stroke="#17202A" stroke-width="2"/>
  <text x="28" y="46" font-size="24" font-family="Georgia, serif" fill="#17202A"><tspan x="28" dy="0">ONE LINEAGE,</tspan><tspan x="28" dy="28">REBUILT FOR TRUST</tspan></text><text x="28" y="108" font-size="16" font-family="Avenir Next, Avenir, Segoe UI, sans-serif" fill="#4B5563"><tspan x="28" dy="0">A domain pivot and greenfield rewrite—</tspan><tspan x="28" dy="20">not one uninterrupted runtime.</tspan></text>
  <path d="M46 174V894" stroke="#2457C5" stroke-width="4" fill="none"/>
  <g font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
    <g><rect x="68" y="150" width="294" height="126" rx="8" fill="#FAFBFC" stroke="#2457C5" stroke-width="2"/><circle cx="46" cy="174" r="14" fill="#2457C5"/><text x="46" y="180" font-size="16" text-anchor="middle" fill="#FAFBFC"><tspan x="46" dy="0">1</tspan></text><text x="86" y="180" font-size="20" fill="#17202A"><tspan x="86" dy="0">APRIL 2025 · PERSISTENT</tspan><tspan x="86" dy="22">ASSISTANT</tspan></text><text x="86" y="230" font-size="16" fill="#4B5563"><tspan x="86" dy="0">Context, rules, routing,</tspan><tspan x="86" dy="20">and traces over time.</tspan></text></g>
    <g><rect x="68" y="294" width="294" height="126" rx="8" fill="#FAFBFC" stroke="#2457C5" stroke-width="2"/><circle cx="46" cy="318" r="14" fill="#2457C5"/><text x="46" y="324" font-size="16" text-anchor="middle" fill="#FAFBFC"><tspan x="46" dy="0">2</tspan></text><text x="86" y="324" font-size="20" fill="#17202A"><tspan x="86" dy="0">FINANCE-DOMAIN PIVOT</tspan></text><text x="86" y="356" font-size="16" fill="#4B5563"><tspan x="86" dy="0">Research, coordination, and</tspan><tspan x="86" dy="20">independent oversight.</tspan></text></g>
    <g><rect x="68" y="438" width="294" height="126" rx="8" fill="#FAFBFC" stroke="#2457C5" stroke-width="2"/><circle cx="46" cy="462" r="14" fill="#2457C5"/><text x="46" y="468" font-size="16" text-anchor="middle" fill="#FAFBFC"><tspan x="46" dy="0">3</tspan></text><text x="86" y="468" font-size="20" fill="#17202A"><tspan x="86" dy="0">EXECUTABLE LAYERED</tspan><tspan x="86" dy="22">RUNTIME</tspan></text><text x="86" y="518" font-size="16" fill="#4B5563"><tspan x="86" dy="0">Responsibility boundaries</tspan><tspan x="86" dy="20">become visible work.</tspan></text></g>
    <g><rect x="68" y="582" width="294" height="126" rx="8" fill="#FFF0D7" stroke="#A85D00" stroke-width="2"/><circle cx="46" cy="606" r="14" fill="#A85D00"/><text x="46" y="612" font-size="16" text-anchor="middle" fill="#FAFBFC"><tspan x="46" dy="0">4</tspan></text><text x="86" y="612" font-size="20" fill="#17202A"><tspan x="86" dy="0">2026 GREENFIELD</tspan><tspan x="86" dy="22">REWRITE</tspan></text><text x="86" y="662" font-size="16" fill="#4B5563"><tspan x="86" dy="0">Clearer authority boundaries</tspan><tspan x="86" dy="20">replace a seamless-upgrade story.</tspan></text></g>
    <g><rect x="68" y="726" width="294" height="126" rx="8" fill="#FAFBFC" stroke="#2457C5" stroke-width="2"/><circle cx="46" cy="750" r="14" fill="#2457C5"/><text x="46" y="756" font-size="16" text-anchor="middle" fill="#FAFBFC"><tspan x="46" dy="0">5</tspan></text><text x="86" y="756" font-size="20" fill="#17202A"><tspan x="86" dy="0">TRUST-FIRST RESEARCH</tspan></text><text x="86" y="788" font-size="16" fill="#4B5563"><tspan x="86" dy="0">Independent audit becomes</tspan><tspan x="86" dy="20">the success criterion.</tspan></text></g>
  </g>
  <text x="28" y="930" font-size="20" font-family="Georgia, serif" fill="#17202A"><tspan x="28" dy="0">“Can every important claim</tspan><tspan x="28" dy="24">survive an independent audit?”</tspan></text>
</svg>
