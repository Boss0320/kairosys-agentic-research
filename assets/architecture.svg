<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1320" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">Kairosys public research and two-layer admission flow</title>
  <desc id="architecture-desc">A RESEARCH QUESTION moves through AGENTIC COORDINATION, FUNDAMENTALS, INDUSTRY + SUPPLY CHAIN, MARKET CONTEXT, VALUATION + SCENARIOS, TYPED EVIDENCE + PROVENANCE, PERSISTENT CONTEXT + DECISION TRACE, LAYER 1 / INTEGRITY, LAYER 2 / UTILITY, and DELIVERY.</desc>
  <rect width="390" height="1320" fill="#EEF1F3"/>
  <rect x="12" y="12" width="366" height="1296" rx="10" fill="#FAFBFC" stroke="#17202A" stroke-width="2"/>
  <text x="28" y="46" font-size="24" font-family="Georgia, serif" fill="#17202A"><tspan x="28" dy="0">KAIROSYS RESEARCH FLOW</tspan></text>
  <text x="28" y="76" font-size="16" font-family="Avenir Next, Avenir, Segoe UI, sans-serif" fill="#4B5563"><tspan x="28" dy="0">Research breadth first.</tspan><tspan x="28" dy="20">Controlled admission last.</tspan></text>
  <path d="M46 148V890" stroke="#2457C5" stroke-width="4" fill="none"/>
  <g font-family="Avenir Next, Avenir, Segoe UI, sans-serif">
    <g><rect x="28" y="120" width="334" height="132" rx="8" fill="#FAFBFC" stroke="#2457C5" stroke-width="2"/><circle cx="46" cy="148" r="14" fill="#2457C5"/><text x="46" y="154" font-size="16" text-anchor="middle" fill="#FAFBFC"><tspan x="46" dy="0">1</tspan></text><text x="76" y="152" font-size="20" fill="#17202A"><tspan x="76" dy="0">RESEARCH QUESTION</tspan></text><text x="76" y="184" font-size="16" fill="#4B5563"><tspan x="76" dy="0">Company · industry · valuation</tspan><tspan x="76" dy="20">defines the work to be done.</tspan></text></g>
    <g><rect x="28" y="270" width="334" height="132" rx="8" fill="#FAFBFC" stroke="#2457C5" stroke-width="2"/><circle cx="46" cy="298" r="14" fill="#2457C5"/><text x="46" y="304" font-size="16" text-anchor="middle" fill="#FAFBFC"><tspan x="46" dy="0">2</tspan></text><text x="76" y="302" font-size="20" fill="#17202A"><tspan x="76" dy="0">AGENTIC COORDINATION</tspan></text><text x="76" y="334" font-size="16" fill="#4B5563"><tspan x="76" dy="0">Routes evidence and specialist work;</tspan><tspan x="76" dy="20">model prose is not source authority.</tspan></text></g>
    <g><rect x="28" y="420" width="334" height="132" rx="8" fill="#FAFBFC" stroke="#2457C5" stroke-width="2"/><circle cx="46" cy="448" r="14" fill="#2457C5"/><text x="46" y="454" font-size="16" text-anchor="middle" fill="#FAFBFC"><tspan x="46" dy="0">3</tspan></text><text x="76" y="452" font-size="20" fill="#17202A"><tspan x="76" dy="0">RESEARCH LENSES</tspan></text><text x="76" y="484" font-size="16" fill="#4B5563"><tspan x="76" dy="0">FUNDAMENTALS · INDUSTRY</tspan><tspan x="76" dy="20">MARKET CONTEXT · VALUATION</tspan><tspan x="76" dy="20">Catalysts · falsifiers · next steps</tspan></text></g>
    <g><rect x="28" y="570" width="334" height="132" rx="8" fill="#FAFBFC" stroke="#2457C5" stroke-width="2"/><circle cx="46" cy="598" r="14" fill="#2457C5"/><text x="46" y="604" font-size="16" text-anchor="middle" fill="#FAFBFC"><tspan x="46" dy="0">4</tspan></text><text x="76" y="602" font-size="20" fill="#17202A"><tspan x="76" dy="0">EVIDENCE + TRACE</tspan></text><text x="76" y="634" font-size="16" fill="#4B5563"><tspan x="76" dy="0">TYPED EVIDENCE + PROVENANCE</tspan><tspan x="76" dy="20">PERSISTENT CONTEXT +</tspan><tspan x="76" dy="20">DECISION TRACE</tspan></text></g>
    <g><rect x="28" y="720" width="334" height="132" rx="8" fill="#FAFBFC" stroke="#2457C5" stroke-width="2"/><circle cx="46" cy="748" r="14" fill="#2457C5"/><text x="46" y="754" font-size="16" text-anchor="middle" fill="#FAFBFC"><tspan x="46" dy="0">5</tspan></text><text x="76" y="752" font-size="20" fill="#17202A"><tspan x="76" dy="0">TWO-LAYER ADMISSION</tspan></text><text x="76" y="784" font-size="16" fill="#4B5563"><tspan x="76" dy="0">LAYER 1 / INTEGRITY</tspan><tspan x="76" dy="20">LAYER 2 / UTILITY</tspan></text></g>
    <text x="28" y="918" font-size="20" fill="#17202A"><tspan x="28" dy="0">DELIVERY</tspan></text>
    <g font-size="16"><rect x="28" y="938" width="334" height="62" rx="7" fill="#E1E9FA" stroke="#2457C5" stroke-width="2"/><text x="44" y="964" font-size="16" fill="#17202A"><tspan x="44" dy="0">EDITABLE DRAFT</tspan><tspan x="44" dy="20">Evidence, state, and wording cleared.</tspan></text><rect x="28" y="1016" width="334" height="62" rx="7" fill="#FFF0D7" stroke="#A85D00" stroke-width="2"/><text x="44" y="1042" font-size="16" fill="#17202A"><tspan x="44" dy="0">REVIEW-CAPPED</tspan><tspan x="44" dy="20">A labeled draft needs analyst review.</tspan></text><rect x="28" y="1094" width="334" height="62" rx="7" fill="#EEF1F3" stroke="#4B5563" stroke-width="2"/><text x="44" y="1120" font-size="16" fill="#17202A"><tspan x="44" dy="0">CONTEXT-ONLY</tspan><tspan x="44" dy="20">Background remains; target is removed.</tspan></text><rect x="28" y="1172" width="334" height="62" rx="7" fill="#FDE8E7" stroke="#B42318" stroke-width="2"/><text x="44" y="1198" font-size="16" fill="#17202A"><tspan x="44" dy="0">WITHHELD</tspan><tspan x="44" dy="20">Insufficient or conflicting material stops.</tspan></text></g>
  </g>
</svg>
